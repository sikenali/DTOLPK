<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTOLPK - Docker to Lazycat Package Converter</title>
  <link rel="icon" href="assets/brand-logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg:#dfeeff; --card:rgba(255,255,255,.36); --line:rgba(125,211,252,.34); --line-soft:rgba(255,255,255,.58); --text:#08243a; --muted:#49657f; --brand:#14b8a6; --brand-soft:rgba(45,212,191,.2); --danger:#ef4444; --accent:#f59e0b; --sidebar-top:rgba(255,255,255,.3); --sidebar-bottom:rgba(255,255,255,.22); }

      filter:blur(52px); pointer-events:none; z-index:0; }

    .nav { padding:16px 0; flex:1; overflow-y:auto; }

    .nav-item.nav-item-active { background:linear-gradient(135deg,rgba(20,184,166,.76) 0%,rgba(14,165,233,.72) 100%); color:#ffffff; font-weight:600; border-color:rgba(255,255,255,.55); box-shadow:0 10px 22px rgba(14,116,144,.2), inset 0 1px 0 rgba(255,255,255,.34); }
    .nav-item.nav-item-active i { color:#ffffff; }

    .workspace { flex:1; overflow:auto; padding:26px 28px; position:relative; z-index:1; }

    .page-head p { margin:8px 0 0; color:#475569; font-size:14px; }
    .section-content { margin-top:24px; }

      backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%); padding:20px; overflow:hidden; }
    .panel::before { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;

    .field-group { margin-bottom:14px; }

    .label { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500; margin-bottom:8px; }

    #compose-content,#dockerfile-content { min-height:400px; height:400px; }

    #generate-app .align-row-2 { min-height:162px; }
    #generate-app #app-package { min-height:42px; }

    .mono { font-family:"JetBrains Mono",Consolas,monospace; font-size:12px; line-height:1.55; }
    .field-row { display:flex; gap:10px; align-items:center; }
    .btn-primary,.btn-secondary,.btn-danger,.btn-ghost { border-radius:11px; font-size:14px; font-weight:600; padding:9px 14px; border:1px solid transparent; cursor:pointer; transition:all .2s ease; white-space:nowrap; backdrop-filter:blur(10px) saturate(150%); -webkit-backdrop-filter:blur(10px) saturate(150%); }
    .btn-primary { background:linear-gradient(135deg,rgba(20,184,166,.92) 0%,rgba(14,165,233,.86) 100%); color:#fff; border-color:rgba(255,255,255,.4); box-shadow:0 10px 20px rgba(14,116,144,.24), inset 0 1px 0 rgba(255,255,255,.28); }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 13px 24px rgba(14,116,144,.28), inset 0 1px 0 rgba(255,255,255,.32); }
    .btn-secondary { background:rgba(255,255,255,.62); border-color:rgba(255,255,255,.74); color:#334155; box-shadow:0 6px 14px rgba(14,116,144,.1); }
    .btn-secondary:hover { background:rgba(255,255,255,.78); border-color:rgba(255,255,255,.9); transform:translateY(-1px); }
    .btn-danger { background:rgba(254,226,226,.76); border-color:rgba(252,165,165,.62); color:#b91c1c; box-shadow:0 6px 14px rgba(239,68,68,.14); }
    .btn-danger:hover { background:rgba(254,202,202,.88); transform:translateY(-1px); }
    .btn-ghost { background:rgba(255,255,255,.45); border-color:rgba(255,255,255,.64); color:var(--muted); box-shadow:0 6px 14px rgba(14,116,144,.08); }
    .btn-ghost:hover { color:#334155; background:rgba(255,255,255,.66); transform:translateY(-1px); }

    .helper { margin-top:6px; color:#94a3b8; font-size:12px; }
    .compose-list { margin-top:10px; border:1px dashed var(--line); border-radius:8px; background:#fcfdff; padding:10px; min-height:56px; }
    .tabbar { position:relative; display:flex; align-items:center; gap:8px; margin-bottom:18px; background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.36) 100%); border:1px solid rgba(255,255,255,.72); border-radius:13px; padding:6px; overflow:hidden; backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 8px 18px rgba(14,116,144,.08); }
    .tab { border:0; background:transparent; color:var(--muted); font-size:14px; padding:10px 14px; cursor:pointer; border-radius:10px; transition:background .22s ease,color .22s ease,transform .22s ease,box-shadow .22s ease; }
    .tab:hover { background:rgba(255,255,255,.42); color:#0f766e; transform:translateX(1px); }
    .tab.tab-active { background:linear-gradient(135deg,rgba(20,184,166,.78) 0%,rgba(14,165,233,.72) 100%); color:#ffffff; font-weight:700; box-shadow:0 8px 18px rgba(14,116,144,.2), inset 0 1px 0 rgba(255,255,255,.3); transform:translateY(-1px); }
    .tab-pane { display:none; opacity:0; transform:translateY(6px); }
    .tab-pane.tab-pane-active { display:block; animation:fadeUp .24s ease both; }
    .feature-list { display:grid; gap:9px; }
    .feature-row { display:flex; align-items:flex-start; gap:7px; padding:7px 7px 9px; border-bottom:1px solid rgba(255,255,255,.5); border-radius:10px; transition:background .2s ease, box-shadow .2s ease; }
    .feature-row:hover { background:rgba(255,255,255,.3); box-shadow:0 8px 16px rgba(14,116,144,.08); }
    .feature-row:last-child { border-bottom:0; padding-bottom:0; }
    .feature-row input[type="checkbox"] { margin-top:2px; width:16px; height:16px; accent-color:#0ea5a4; flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(14,116,144,.2)); }
    .feature-title { font-size:15px; font-weight:600; margin:0; }
    .feature-desc { font-size:12px; color:#94a3b8; margin:4px 0 0; }
    .two-card { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
    .env-config-cards { align-items:stretch; }
    .env-config-cards > .panel { height:100%; display:flex; flex-direction:column; }
    .env-dynamic-list { flex:1; min-height:260px; }
    .platform-grid { display:flex; flex-wrap:wrap; gap:12px; }
    .platform-grid label,
    .version-row { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid rgba(255,255,255,.7); border-radius:10px; font-size:13px; color:#334155; cursor:pointer; transition:all .18s ease; background:rgba(255,255,255,.42); backdrop-filter:blur(10px) saturate(145%); -webkit-backdrop-filter:blur(10px) saturate(145%); box-shadow:0 4px 10px rgba(14,116,144,.06); }
    .platform-grid input,
    .version-row input { accent-color:#0ea5a4; }
    .version-row { margin-bottom:10px; }
    .platform-grid .version-row { margin-bottom:0; }
    .platform-grid label:has(input:checked),
    .version-row:has(input:checked) { background:linear-gradient(135deg,rgba(20,184,166,.24) 0%,rgba(14,165,233,.18) 100%); border-color:rgba(20,184,166,.44); color:#0f766e; box-shadow:0 8px 16px rgba(14,116,144,.12); }
    .upload-zone { position:relative; width:64px; height:64px; border:1px dashed #9fb3c8; border-radius:12px; background:linear-gradient(180deg,#f8fcff 0%,#f1f6fc 100%); text-align:center; color:var(--muted); font-size:13px; display:flex; align-items:center; justify-content:center; overflow:visible; cursor:pointer; user-select:none; }
    .upload-zone:hover { border-color:#5eead4; box-shadow:0 0 0 3px rgba(45,212,191,.14); }
    .upload-zone:focus-visible { outline:none; border-color:#0ea5a4; box-shadow:0 0 0 3px rgba(45,212,191,.2); }
    .upload-zone i { font-size:22px; margin:0; color:#94a3b8; }
    .upload-zone-placeholder { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
    .upload-zone-preview { display:none; align-items:center; justify-content:center; width:100%; height:100%; }
    .upload-zone-preview img { width:64px; height:64px; object-fit:cover; border-radius:12px; border:1px solid var(--line); background:#fff; }
    .upload-zone.has-preview .upload-zone-placeholder { display:none; }
    .upload-zone.has-preview .upload-zone-preview { display:flex; }
    .icon-remove-btn { position:absolute; top:-7px; right:-7px; width:20px; height:20px; border:1px solid rgba(255,255,255,.8); border-radius:999px; background:rgba(15,23,42,.85); color:#fff; display:none; align-items:center; justify-content:center; font-size:11px; cursor:pointer; padding:0; }
    .upload-zone.has-preview .icon-remove-btn { display:flex; }
    .icon-remove-btn:hover { background:#dc2626; }
    .preview { margin-top:10px; display:none; }
    .preview img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
    .convert-area { margin-top:16px; display:grid; gap:16px; }
    .terminal-card { padding:14px; border:1px solid rgba(255,255,255,.72); border-radius:12px; background:linear-gradient(145deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.5) 100%); box-shadow:0 16px 28px rgba(14,116,144,.12), inset 0 1px 0 rgba(255,255,255,.48); backdrop-filter:blur(16px) saturate(155%); -webkit-backdrop-filter:blur(16px) saturate(155%); }
    .terminal-progress-head { justify-content:space-between; margin-bottom:10px; }
    .terminal-progress-label { font-size:14px; font-weight:600; color:#244761; }
    .progress { width:100%; height:10px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.52); border:1px solid rgba(255,255,255,.72); box-shadow:inset 0 1px 3px rgba(14,116,144,.15); }
    .progress > div { width:0; height:100%; background:linear-gradient(90deg,rgba(20,184,166,.95) 0%,rgba(14,165,233,.88) 100%); transition:width .3s ease; position:relative; overflow:hidden; box-shadow:0 4px 10px rgba(14,116,144,.2); }
    .progress > div::after { content:""; position:absolute; top:0; left:-36%; width:36%; height:100%; background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0)); animation:glassShimmer 2.2s linear infinite; }
    #convert-log { border:1px solid rgba(126,211,252,.35); background:linear-gradient(180deg,rgba(12,28,45,.88) 0%,rgba(12,38,58,.92) 100%); border-radius:10px; height:260px; overflow-y:auto; padding:10px 10px 12px; font-size:12px; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 18px rgba(8,36,58,.25); }
    #convert-log::-webkit-scrollbar { width:8px; }
    #convert-log::-webkit-scrollbar-thumb { background:rgba(125,211,252,.32); border-radius:999px; }
    #convert-log::-webkit-scrollbar-track { background:transparent; }
    .terminal-placeholder { color:#7ea3bf; font-family:"JetBrains Mono",Consolas,monospace; font-size:12px; }
    .terminal-line { display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; font-family:"JetBrains Mono",Consolas,monospace; line-height:1.5; }
    .terminal-line-time { color:#5fb0d2; flex-shrink:0; min-width:64px; }
    .terminal-line-message { color:#d7eefc; white-space:pre-wrap; word-break:break-word; }
    .terminal-line-success .terminal-line-message { color:#86efac; }
    .terminal-line-error .terminal-line-message { color:#fda4af; }
    .compat-hidden { display:none; }
    .modal { position:fixed; inset:0; background:rgba(15,23,42,.4); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
    .modal.show { display:flex; }
    .modal-card { width:100%; max-width:600px; background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.8); border-radius:14px; box-shadow:0 20px 44px rgba(15,23,42,.24); padding:24px;
      backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%); }
    .modal-title { font-size:20px; font-weight:700; margin:0; }
    .modal-actions { margin-top:22px; display:flex; justify-content:flex-end; gap:10px; }
    .toast-container { position:fixed; top:16px; right:16px; z-index:120; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
    .glass-toast { min-width:260px; max-width:min(420px,calc(100vw - 32px)); display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.72); background:linear-gradient(135deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.5) 100%); box-shadow:0 12px 24px rgba(14,116,144,.18), inset 0 1px 0 rgba(255,255,255,.5); backdrop-filter:blur(16px) saturate(155%); -webkit-backdrop-filter:blur(16px) saturate(155%); color:#0f2940; transform:translateX(120%); opacity:0; transition:transform .28s ease, opacity .28s ease; pointer-events:auto; }
    .glass-toast.is-visible { transform:translateX(0); opacity:1; }
    .glass-toast-icon { width:20px; text-align:center; margin-top:2px; }
    .glass-toast-text { flex:1; line-height:1.45; font-size:13px; word-break:break-word; }
    .glass-toast--success { border-color:rgba(16,185,129,.34); background:linear-gradient(135deg,rgba(209,250,229,.72) 0%,rgba(236,253,245,.58) 100%); }
    .glass-toast--success .glass-toast-icon { color:#059669; }
    .glass-toast--error { border-color:rgba(239,68,68,.34); background:linear-gradient(135deg,rgba(254,226,226,.76) 0%,rgba(254,242,242,.62) 100%); }
    .glass-toast--error .glass-toast-icon { color:#dc2626; }
    .glass-toast--info { border-color:rgba(56,189,248,.34); background:linear-gradient(135deg,rgba(224,242,254,.76) 0%,rgba(240,249,255,.62) 100%); }
    .glass-toast--info .glass-toast-icon { color:#0284c7; }
    .glass-dialog-overlay { position:fixed; inset:0; z-index:110; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(8,36,58,.36); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .glass-dialog-card { width:100%; max-width:460px; border-radius:16px; border:1px solid rgba(255,255,255,.72); background:linear-gradient(140deg,rgba(255,255,255,.74) 0%,rgba(255,255,255,.52) 100%); box-shadow:0 24px 44px rgba(8,36,58,.24), inset 0 1px 0 rgba(255,255,255,.52); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); padding:20px; }
    .glass-dialog-title { margin:0 0 10px; font-size:20px; font-weight:700; color:#0b2940; letter-spacing:.2px; }
    .glass-dialog-message { margin:0; color:#39536d; line-height:1.55; font-size:14px; }
    .glass-dialog-actions { margin-top:18px; display:flex; justify-content:flex-end; gap:10px; }
    .glass-dialog-btn { border:1px solid rgba(255,255,255,.74); border-radius:11px; padding:8px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s ease; backdrop-filter:blur(10px) saturate(145%); -webkit-backdrop-filter:blur(10px) saturate(145%); }
    .glass-dialog-btn-primary { color:#fff; background:linear-gradient(135deg,rgba(20,184,166,.92) 0%,rgba(14,165,233,.88) 100%); border-color:rgba(255,255,255,.44); box-shadow:0 10px 18px rgba(14,116,144,.22); }
    .glass-dialog-btn-primary:hover { transform:translateY(-1px); box-shadow:0 12px 22px rgba(14,116,144,.26); }
    .glass-dialog-btn-secondary { color:#334155; background:rgba(255,255,255,.68); }
    .glass-dialog-btn-secondary:hover { transform:translateY(-1px); background:rgba(255,255,255,.82); }
    .glass-dialog-btn:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(56,189,248,.28); }
    .text-danger { color:#dc2626; }
    @media (max-width:1080px) {
      body { overflow:auto; }
      .app-shell { display:block; height:auto; min-height:100vh; }
      .sidebar { width:100%; border-right:0; border-bottom:1px solid rgba(148,163,184,.25); box-shadow:none; }
      .nav { display:flex; gap:6px; padding:10px; }
      .nav-item { border-left:0; border-radius:8px; height:44px; padding:0 12px; margin:0; }
      .workspace { padding:14px; }
      .grid-two,.two-card { grid-template-columns:1fr; gap:14px; }
      #generate-app .align-row-2,
      #generate-app .equal-height-field { min-height:auto; }
      #convert-log { height:220px; }
    }
    .section-content { animation:fadeUp .24s ease; transform-origin:top center; }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(6px); }
      to { opacity:1; transform:translateY(0); }
    }
    @keyframes glassShimmer {
      from { left:-36%; }
      to { left:136%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/brand-logo.svg" alt="DTOLPK" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='build/icon.svg';}else{this.onerror=null;this.src='build/icon.ico';}"></div>
        <div>
          <div class="brand-title"></div>
          <div class="brand-meta">懒猫微服非官方打包工具</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-item nav-item-active" data-section="select-project"><i class="fa-solid fa-folder-open"></i><span class="title">选择项目</span></div>
        <div class="nav-item" data-section="project-config"><i class="fa-solid fa-sliders"></i><span class="title">项目配置</span></div>
        <div class="nav-item" data-section="generate-app"><i class="fa-solid fa-rocket"></i><span class="title">生成应用</span></div>
      </nav>
      <div class="sidebar-foot"><div>V2019.9.12</div><div>© 2026</div></div>
    </aside>

    <main class="workspace">
      <div class="page-head">
        <h1 id="page-title">选择项目</h1>
        <p id="page-subtitle">选择 Docker Compose / Dockerfile 后，自动解析并填充配置</p>
      </div>

      <section id="select-project" class="section-content">
        <div class="grid-two select-project-cards">
          <div class="panel">
            <h2 class="panel-title">Docker Compose</h2>
            <div class="field-group">
              <div class="field-row">
                <input id="compose-path" class="field" type="text" placeholder="">
                <button id="select-compose-btn" type="button" class="btn-secondary"><i class="fa fa-folder-open"></i> 选择文件</button>
                <button id="clear-compose-btn" type="button" class="btn-secondary"><i class="fa fa-times"></i> 清除</button>
              </div>
            </div>
            <div class="field-group">
              <label class="label">Docker Compose 配置内容</label>
              <textarea id="compose-content" class="field mono" placeholder=""></textarea>
            </div>
          </div>

          <div class="panel">
            <h2 class="panel-title">Dockerfile</h2>
            <div class="field-group">
              <div class="field-row">
                <input id="dockerfile-path" class="field" type="text" placeholder="">
                <button id="select-dockerfile-btn" type="button" class="btn-secondary"><i class="fa fa-folder-open"></i> 选择文件</button>
                <button id="clear-dockerfile-btn" type="button" class="btn-secondary"><i class="fa fa-times"></i> 清除</button>
              </div>
            </div>
            <div class="field-group">
              <label class="label">Dockerfile 配置内容</label>
              <textarea id="dockerfile-content" class="field mono" placeholder=""></textarea>
            </div>
          </div>
        </div>
      </section>

      <section id="project-config" class="section-content" style="display: none;">
        <div class="panel">
          <div class="tabbar">
            <button class="tab tab-active" data-tab="app-config">应用配置</button>
            <button class="tab" data-tab="route-config">路由配置</button>
            <button class="tab" data-tab="env-config">环境配置</button>
          </div>

          <div id="app-config" class="tab-pane">
            <div class="feature-list">
              <label class="feature-row"><input id="feature-background-task" type="checkbox"><span><p class="feature-title">后台任务</p><p class="feature-desc">允许应用在后台持续运行并保持服务可用</p></span></label>
              <label class="feature-row"><input id="feature-public-path" type="checkbox"><span><p class="feature-title">公网路径</p><p class="feature-desc">启用后可将指定路由公开到外部网络</p></span></label>
              <label class="feature-row"><input id="feature-kvm-accel" type="checkbox"><span><p class="feature-title">KVM 加速</p><p class="feature-desc">为需要虚拟化能力的应用开启 KVM 支持</p></span></label>
              <label class="feature-row"><input id="feature-multi-instance" type="checkbox"><span><p class="feature-title">多实例部署</p><p class="feature-desc">允许应用在同一设备上启动多个实例</p></span></label>
              <label class="feature-row"><input id="feature-gpu-accel" type="checkbox"><span><p class="feature-title">GPU 加速</p><p class="feature-desc">为图形或 AI 场景启用 GPU 计算能力</p></span></label>
              <label class="feature-row"><input id="feature-usb-accel" type="checkbox"><span><p class="feature-title">USB 设备支持</p><p class="feature-desc">允许容器访问主机 USB 外设</p></span></label>
              <label class="feature-row"><input id="feature-file-handler" type="checkbox"><span><p class="feature-title">文件关联</p><p class="feature-desc">配置应用可处理的文件类型及打开方式</p></span></label>
            </div>
          </div>

          <div id="route-config" class="tab-pane" style="display: none;">
            <div class="field-row" style="justify-content: space-between; margin-bottom: 14px;">
              <h3 class="panel-title" style="margin: 0;">路由配置</h3>
              <button id="add-route-btn" type="button" class="btn-ghost"><i class="fa fa-plus"></i> 新增路由</button>
            </div>
            <div id="routes-container" class="space-y-4"></div>
          </div>

          <div id="env-config" class="tab-pane" style="display: none;">
            <div class="two-card env-config-cards">
              <div class="panel" style="padding: 16px;">
                <div class="field-row" style="justify-content: space-between; margin-bottom: 12px;"><h3 class="panel-title" style="margin: 0;">环境变量</h3><button id="add-env-btn" type="button" class="btn-ghost"><i class="fa fa-plus"></i> 新增变量</button></div>
                <div id="env-variables-container" class="space-y-3 env-dynamic-list"></div>
              </div>

              <div class="panel" style="padding: 16px;">
                <div class="field-row" style="justify-content: space-between; margin-bottom: 12px;"><h3 class="panel-title" style="margin: 0;">卷挂载配置</h3><button id="add-volume-btn" type="button" class="btn-ghost"><i class="fa fa-plus"></i> 新增挂载</button></div>
                <div id="volumes-container" class="space-y-3 env-dynamic-list"></div>
              </div>
            </div>
          </div>
        </div>

      </section>

      <section id="generate-app" class="section-content" style="display: none;">
        <div class="panel">
          <div class="two-card">
            <div>
              <div class="field-group"><label class="label required" for="app-name">应用名称</label><input id="app-name" class="field" type="text" placeholder="lazycatapp"></div>
              <div id="icon-upload-group" class="field-group align-row-2">
                <label id="icon-upload-label" class="label">应用图标</label>
                <div id="icon-upload-zone" class="upload-zone" role="button" tabindex="0" aria-label="点击上传图标">
                  <div class="upload-zone-placeholder"><i class="fa-regular fa-image"></i></div>
                  <div class="upload-zone-preview"><img id="icon-upload-preview-img" src="" alt="Uploaded Icon"></div>
                  <button id="remove-icon-btn" type="button" class="icon-remove-btn" aria-label="删除已上传图标"><i class="fa fa-times"></i></button>
                </div>
                <div id="icon-upload-tip" class="helper"></div>
                <input id="icon-path" type="hidden" value="">
              </div>
              <div id="app-package-group" class="field-group equal-height-field"><label class="label required" for="app-package">应用包名</label><input id="app-package" class="field" type="text" placeholder="cloud.lazycat.app.xxx"></div>
            </div>

            <div>
              <div class="field-group"><label class="label" for="app-homepage">应用主页</label><input id="app-homepage" class="field" type="text" placeholder="https://lazycat.cloud"></div>
              <div id="app-description-group" class="field-group align-row-2"><label class="label" for="app-description">应用描述</label><textarea id="app-description" class="field" placeholder="请输入应用的功能说明..."></textarea></div>
              <div id="unsupported-platform-group" class="field-group equal-height-field">
                <label class="label">不支持平台</label>
                <div class="platform-grid">
                  <label><input id="platform-linux" type="checkbox">Linux</label>
                  <label><input id="platform-macos" type="checkbox">macOS</label>
                  <label><input id="platform-windows" type="checkbox">Windows</label>
                  <label><input id="platform-ios" type="checkbox">iOS</label>
                  <label><input id="platform-android" type="checkbox">Android</label>
                  <label><input id="platform-tvos" type="checkbox">智慧屏</label>
                  <label class="version-row"><input id="has-version-requirement" type="checkbox">限制系统版本</label>
                </div>
                <div id="version-requirement-field" style="display: none;"><input id="min-os-version" class="field" type="text" value=">= 1.0.18" placeholder="例如 >= 1.0.18"></div>
              </div>
            </div>
          </div>

          <div class="grid-two" style="gap: 14px; margin-top: 14px;">
            <div class="field-group" style="margin-bottom: 0;">
              <label class="label required" for="app-version">应用版本</label>
              <input id="app-version" class="field" type="text" value="1.0.0" placeholder="1.0.0">
            </div>
            <div class="field-group" style="margin-bottom: 0;">
              <label class="label" for="registry-url">推送镜像仓库地址</label>
              <input id="registry-url" class="field" type="url" placeholder="dev.$BOXNAME.heiyu.space/lzc/lazycatapp:latest">
            </div>
            <div class="field-group" style="margin-bottom: 0;">
              <label class="label" for="app-author">应用作者</label>
              <input id="app-author" class="field" type="text" placeholder="lazycat">
            </div>
            <div class="field-group" style="margin-bottom: 0;">
              <label class="label required" for="output-directory">生成应用存储路径</label>
              <div class="field-row">
                <input id="output-directory" class="field" type="text" placeholder="选择生成应用文件夹的绝对路径">
                <button id="select-output-dir-btn" type="button" class="btn-secondary">选择目录</button>
              </div>
            </div>
          </div>

          <div class="convert-area">
            <button id="start-convert-btn" type="button" class="btn-primary" style="height: 44px; font-size: 15px;"><i class="fa fa-play"></i> 开始转换</button>
            <div class="terminal-card">
              <div class="field-row terminal-progress-head"><span id="progress-label" class="terminal-progress-label">转换进度</span><span id="progress-percentage" style="font-size: 14px; color: var(--brand); font-weight: 700;">0%</span></div>
              <div class="progress"><div id="convert-progress-fill"></div></div>
              <div id="convert-log" style="margin-top: 12px;"><div id="convert-log-placeholder" class="terminal-placeholder">等待开始转换...</div></div>
            </div>
          </div>
        </div>

      </section>

      <div class="compat-hidden" aria-hidden="true">
        <div id="compose-files-list"></div>
        <select id="push-target"><option value="none" selected>???</option><option value="custom">?????</option><option value="lazycat">??????????</option></select>
        <input id="build-context" type="text" value=".">
        <div id="custom-registry-field" style="display:none;"></div>
        <div id="lazycat-box-field" style="display:none;"><input id="box-name" type="text" value="default"></div>
        <input id="dockerfile-output-path" type="text" value="">
        <button id="select-dockerfile-output-btn" type="button"></button>
        <div id="section-title"></div><div id="progress-text"></div><div id="progress-fill"></div>
        <button id="save-config-btn" type="button"></button><button id="reset-config-btn" type="button"></button>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/steps.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pageMeta = {
        'select-project': {
          title: '选择项目',
          subtitle: '选择 Docker Compose / Dockerfile 后，自动解析并填充配置'
        },
        'project-config': {
          title: '项目配置',
          subtitle: '配置应用、路由、环境变量与卷挂载'
        },
        'generate-app': {
          title: '生成应用',
          subtitle: '完成信息填写后开始转换并查看进度'
        }
      };

      const setText = function (selector, value) {
        const el = document.querySelector(selector);
        if (el) el.textContent = value;
      };

      const setHTML = function (selector, value) {
        const el = document.querySelector(selector);
        if (el) el.innerHTML = value;
      };

      const setPlaceholder = function (id, value) {
        const el = document.getElementById(id);
        if (el) el.setAttribute('placeholder', value);
      };

      const applyLocalizedText = function () {
        setText('.brand-meta', '懒猫微服非官方打包工具');
        setText('.nav-item[data-section="select-project"] .title', '选择项目');
        setText('.nav-item[data-section="project-config"] .title', '项目配置');
        setText('.nav-item[data-section="generate-app"] .title', '生成应用');
        setText('.sidebar-foot div:last-child', '©2026 DTOLPK');
        setText('#page-title', pageMeta['select-project'].title);
        setText('#page-subtitle', pageMeta['select-project'].subtitle);

        setHTML('#select-compose-btn', '<i class="fa fa-folder-open"></i> 选择文件');
        setHTML('#clear-compose-btn', '<i class="fa fa-times"></i> 清除');
        setText('label[for="compose-content"]', '配置内容');
        setText('#select-project .field-group .label', 'Docker Compose 配置内容');

        setHTML('#select-dockerfile-btn', '<i class="fa fa-folder-open"></i> 选择文件');
        setHTML('#clear-dockerfile-btn', '<i class="fa fa-times"></i> 清除');
        const labels = document.querySelectorAll('#select-project .field-group .label');
        if (labels[0]) labels[0].textContent = 'Docker Compose 配置内容';
        if (labels[1]) labels[1].textContent = 'Dockerfile 配置内容';


        const tabs = document.querySelectorAll('#project-config .tabbar .tab');
        if (tabs[0]) tabs[0].textContent = '应用配置';
        if (tabs[1]) tabs[1].textContent = '路由配置';
        if (tabs[2]) tabs[2].textContent = '环境配置';

        const featureTitles = document.querySelectorAll('#app-config .feature-title');
        const featureDescs = document.querySelectorAll('#app-config .feature-desc');
        const featureTitleText = [
          '后台任务',
          '公网路径',
          'KVM 加速',
          '多实例部署',
          'GPU 加速',
          'USB 设备支持',
          '文件关联'
        ];
        const featureDescText = [
          '允许应用在后台持续运行并保持服务可用',
          '启用后可将指定路由公开到外部网络',
          '为需要虚拟化能力的应用开启 KVM 支持',
          '允许应用在同一设备上启动多个实例',
          '为图形或 AI 场景启用 GPU 计算能力',
          '允许容器访问主机 USB 外设',
          '配置应用可处理的文件类型及打开方式'
        ];
        featureTitles.forEach(function (el, idx) {
          if (featureTitleText[idx]) el.textContent = featureTitleText[idx];
        });
        featureDescs.forEach(function (el, idx) {
          if (featureDescText[idx]) el.textContent = featureDescText[idx];
        });

        setText('#route-config .panel-title', '路由配置');
        setHTML('#add-route-btn', '<i class="fa fa-plus"></i> 新增路由');

        const envTitles = document.querySelectorAll('#env-config .panel-title');
        if (envTitles[0]) envTitles[0].textContent = '环境变量';
        if (envTitles[1]) envTitles[1].textContent = '卷挂载配置';
        setHTML('#add-env-btn', '<i class="fa fa-plus"></i> 新增变量');
        setHTML('#add-volume-btn', '<i class="fa fa-plus"></i> 新增挂载');


        setText('label[for="app-name"]', '应用名称');
        setText('#icon-upload-label', '应用图标');
        setText('label[for="app-package"]', '应用包名');
        setText('label[for="app-homepage"]', '应用主页');
        setText('label[for="app-description"]', '应用描述');
        
        // 确保平台标签正确显示（避免覆盖 label 子节点导致 checkbox 丢失）
        const setPlatformLabelText = (inputId, text) => {
          const input = document.getElementById(inputId);
          const label = input ? input.parentElement : null;
          if (!label) return;
          const textNode = Array.from(label.childNodes).find((node) => node.nodeType === Node.TEXT_NODE);
          if (textNode) {
            textNode.textContent = text;
          } else {
            label.appendChild(document.createTextNode(text));
          }
        };
        setPlatformLabelText('platform-linux', 'Linux');
        setPlatformLabelText('platform-macos', 'macOS');
        setPlatformLabelText('platform-windows', 'Windows');
        setPlatformLabelText('platform-ios', 'iOS');
        setPlatformLabelText('platform-android', 'Android');
        setPlatformLabelText('platform-tvos', '智慧屏');

        setText('#icon-upload-tip', '');
        setPlaceholder('app-description', '请输入应用的功能说明...');

        const platformGroup = document.querySelector('#generate-app .platform-grid')?.closest('.field-group');
        const platformLabel = platformGroup ? platformGroup.querySelector(':scope > .label') : null;
        if (platformLabel) platformLabel.textContent = '不支持平台';
        setPlatformLabelText('platform-tvos', '智慧屏');
        setPlatformLabelText('has-version-requirement', '限制系统版本');
        setPlaceholder('min-os-version', '例如 >= 1.0.18');

        setText('label[for="app-version"]', '应用版本');
        setText('label[for="registry-url"]', '推送镜像仓库地址');
        setText('label[for="app-author"]', '应用作者');
        setText('label[for="output-directory"]', '生成应用存储路径');
        setPlaceholder('output-directory', '选择生成应用文件夹的绝对路径');
        setText('#select-output-dir-btn', '选择目录');

        setHTML('#start-convert-btn', '<i class="fa fa-play"></i> 开始转换');
        setText('#progress-label', '转换进度');
        const logInit = document.querySelector('#convert-log-placeholder');
        if (logInit) logInit.textContent = '等待开始转换...';

        const pushTarget = document.getElementById('push-target');
        if (pushTarget) {
          const noneOpt = pushTarget.querySelector('option[value="none"]');
          const customOpt = pushTarget.querySelector('option[value="custom"]');
          const lazycatOpt = pushTarget.querySelector('option[value="lazycat"]');
          if (noneOpt) noneOpt.textContent = '不推送';
          if (customOpt) customOpt.textContent = '自定义仓库';
          if (lazycatOpt) lazycatOpt.textContent = '懒猫盒子（官方仓库）';
        }
      };

      applyLocalizedText();

      const navItems = document.querySelectorAll('.nav-item');
      const sections = document.querySelectorAll('.section-content');
      const pageTitle = document.getElementById('page-title');
      const pageSubtitle = document.getElementById('page-subtitle');

      function switchSection(targetId) {
        navItems.forEach(function (item) {
          item.classList.toggle('nav-item-active', item.getAttribute('data-section') === targetId);
        });
        sections.forEach(function (section) {
          section.style.display = section.id === targetId ? 'block' : 'none';
        });
        if (pageMeta[targetId]) {
          pageTitle.textContent = pageMeta[targetId].title;
          pageSubtitle.textContent = pageMeta[targetId].subtitle;
        }
      }

      navItems.forEach(function (item) {
        item.addEventListener('click', function () {
          switchSection(item.getAttribute('data-section'));
        });
      });

      const tabs = document.querySelectorAll('.tab');
      const tabPanes = document.querySelectorAll('.tab-pane');
      let activePane = document.querySelector('.tab-pane.tab-pane-active') || document.getElementById('app-config') || (tabPanes.length ? tabPanes[0] : null);
      tabPanes.forEach(function (pane) {
        pane.classList.remove('tab-pane-active');
        pane.style.display = 'none';
      });
      if (activePane) {
        activePane.style.display = 'block';
        activePane.classList.add('tab-pane-active');
      }

      const switchTabPane = function (targetId) {
        const nextPane = document.getElementById(targetId);
        if (!nextPane || nextPane === activePane) return;

        if (activePane) {
          activePane.classList.remove('tab-pane-active');
          activePane.style.display = 'none';
        }

        nextPane.style.display = 'block';
        void nextPane.offsetWidth;
        nextPane.classList.add('tab-pane-active');
        activePane = nextPane;
      };

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          const target = tab.getAttribute('data-tab');
          tabs.forEach(function (node) { node.classList.remove('tab-active'); });
          tab.classList.add('tab-active');
          switchTabPane(target);
        });
      });

      const versionCheckbox = document.getElementById('has-version-requirement');
      const versionField = document.getElementById('version-requirement-field');
      if (versionCheckbox && versionField) {
        const syncVersionField = function () {
          versionField.style.display = versionCheckbox.checked ? 'block' : 'none';
        };
        versionCheckbox.addEventListener('change', syncVersionField);
        syncVersionField();
      }

      const pushTarget = document.getElementById('push-target');
      const customRegistryField = document.getElementById('custom-registry-field');
      const lazycatBoxField = document.getElementById('lazycat-box-field');
      const syncPushTargetFields = function () {
        if (!pushTarget || !customRegistryField || !lazycatBoxField) return;
        customRegistryField.style.display = pushTarget.value === 'custom' ? 'block' : 'none';
        lazycatBoxField.style.display = pushTarget.value === 'lazycat' ? 'block' : 'none';
      };
      if (pushTarget) {
        pushTarget.addEventListener('change', syncPushTargetFields);
        syncPushTargetFields();
      }

      const stepManager = new StepManager();
      window.stepManager = stepManager;

    });
  </script>
</body>
</html>
